[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "single_file_autonomous_pipeline"
version = "0.1.0"
description = "Autonomous data preprocessing"
readme = "README.md"
requires-python = ">=3.11.4"
dependencies = [
    "pydantic>=2.0.0",
    "jsonschema>=4.0.0",
    "pyyaml>=6.0.0",
    "docker>=7.1.0",
    "openai>=2.48.0",
    "pandas>=3.0.5",
    "sentence-transformers>=5.7.0",
]

# Defines optional dependencies for specific execution environments or plugins
[project.optional-dependencies]

dev = [
    "pytest>=7.0",
    "ruff>=0.1.0"
]

# Creates a terminal command to run the pipeline globally
[project.scripts]
run-pipeline = "src.main:run"

# Centralizes tool configurations (e.g., Linter settings)
[tool.ruff]
line-length = 88
target-version = "py313"

[tool.pytest.ini_options]
addopts = "-v --tb=short"
testpaths = ["tests"]
